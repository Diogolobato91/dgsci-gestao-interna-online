[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com; font-src 'self' data:; img-src 'self' data: blob: https://*.supabase.co https://api.mapbox.com https://*.mapbox.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mapbox.com https://events.mapbox.com https://*.mapbox.com https://docs.google.com https://*.googleapis.com; worker-src 'self' blob:; media-src 'self' blob: https://*.supabase.co; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O painel legado de estabelecimentos é incorporado somente pelo próprio portal.
# A regra global usa DENY/frame-ancestors 'none', portanto esta rota precisa de
# uma política específica e ainda restrita à mesma origem.
[[headers]]
  for = "/arquivo/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://api.mapbox.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com https://fonts.googleapis.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://api.mapbox.com https://*.mapbox.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mapbox.com https://events.mapbox.com https://*.mapbox.com https://docs.google.com https://*.googleapis.com; worker-src 'self' blob:; media-src 'self' blob: https://*.supabase.co; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"

# This branch is reviewed on the existing owner-private Sites publication.
# Do not produce a public Netlify preview from a push or pull request.
[context.deploy-preview]
  command = "node scripts/private-review-only.cjs"

[context.branch-deploy]
  command = "node scripts/private-review-only.cjs"
